            4. A TRC20 asset name `assets/trc20.{network_id}.{contract}` (example: `assets/trc20.tron-mainnet.TKieffkQXtW8Dr1hKXKGPqCqYi1UNMjJw`)

            5. A Solana SPL token asset name `assets/spl-token.{network_id}.{contract}` (example: `assets/spl-token.solana-mainnet.Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB`)

            6. A Solana SPL token2022 asset name `assets/spl-token-2022.{network_id}.{contract}` (example: `assets/spl-token-2022.solana-mainnet.2b1kV6DkPAnxd5ixfnxCpjxmKwqjjaYmCZfHsFu24GXo`)

            7. A TON Jetton token asset name `assets/jetton.{network_id}.{contract}` (example: `assets/jetton.ton-mainnet.EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs`)'
        amount:
          type: string
          example: '1.1'
          description: 'The amount of the asset to transfer in asset units.


            Example: `1.1`.'
        source:
          type: string
          description: 'The source of the transfer.


            Can be one of the following:

            1. A raw string address, (example: `0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48`)

            2. A wallet containing the asset: `vaults/{vault_id}/wallets/{wallet_id}`

            3. A specific wallet address containing the asset: `vaults/{vault_id}/wallets/{wallet_id}/addresses/{address_id}`


            For Bitcoin, only wallet source is supported (the second option).'
        destination:
          type: string
          description: 'The destination of the transfer.


            Can be one of the following:

            1. A raw string address (example: `0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48` or `bc1q3vfght7rln2c3733dl42navt8pslfya7talfns`)

            2. A wallet: `vaults/{vault_id}/wallets/{wallet_id}`.

            3. A specific wallet address: `vaults/{vault_id}/wallets/{wallet_id}/addresses/{address_id}`.'
        payFeeFromAmount:
          type: boolean
          description: 'If set to true, fees will be paid from transfer amount.


            Currently only supported for native assets on EVM-compatible networks.'
        memo:
          type: string
          description: 'An optional "on-chain" memo to attach to the transfer.


            Implementation may differ between assets.

            Currently supports:

            * TON native transfers (`assets/native.ton-mainnet`)

            * TON jetton transfers (`assets/jetton.ton-mainnet.EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs`)'
        sponsor:
          type: string
          description: 'Optional sponsor wallet/address that will pay transaction fees.


            Can be one of the following:

            1. A raw string address (example: `9B5XszUGdMaxCZ7uSQhPzdks5ZQSmWxrmzCSvtJ6Ns6g`)

            2. A wallet: `vaults/{vault_id}/wallets/{wallet_id}`

            3. A specific wallet address: `vaults/{vault_id}/wallets/{wallet_id}/addresses/{address_id}`

            4. A gas station: `vaults/{vault_id}/gasStations/{gas_station_id}`


            The sponsor must be a Utila-managed wallet with sufficient balance to pay transaction fees.'
        stellarOptions:
          title: Blockchain specific options for Stellar Asset Transfer
          allOf:
          - $ref: '#/components/schemas/AssetTransferStellarOptions'
        xrplOptions:
          title: Blockchain specific options for XRPL Asset Transfer
