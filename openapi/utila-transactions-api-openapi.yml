    StellarTransactionDecodedOperationBodySEP41Payment:
      type: object
      properties:
        spenderAddress:
          description: 'The address that authorized the transfer by consuming its allowance.

            Only set when the underlying SEP41 function is `transfer_from`; unset

            for a plain `transfer` (where the source address authorizes the

            transfer itself).'
          allOf:
          - $ref: '#/components/schemas/apiv2Address'
        sourceAddress:
          title: 'The source of funds for the transfer. This address that authorized the

            in case of a `transfer` call (i.e. the spender_address is empty)'
          allOf:
          - $ref: '#/components/schemas/apiv2Address'
        destinationAddress:
          description: The destination of funds for the transfer.
          allOf:
          - $ref: '#/components/schemas/apiv2Address'
        contractAddress:
          type: string
          description: 'Example: `CB3WFHO46J3WGRAIARNT3XD4Z7NR5SZDNG3SVKN27GOTJAQGQFAH2KAJ`.'
          title: The soroban contract address of the transferred token
        assetRef:
          type: string
          description: 'A weak reference to the asset. The reference is not guaranteed to be valid.


            Example: `assets/asset.stellar-mainnet.CB3WFHO46J3WGRAIARNT3XD4Z7NR5SZDNG3SVKN27GOTJAQGQFAH2KAJ`.'
        rawAmount:
          type: string
          description: 'The raw amount (without decimals) of the payment.


            Example: `10000000`.'
    OperationBodySEP41Payment:
      type: object
      properties:
        spenderAddress:
          type: string
          description: 'The address that will authorize the transfer by consuming its

            allowance on `source_address`.


            When set, the transfer is built as a SEP41 `transfer_from` call where

            `spender_address` must have a sufficient pre-existing allowance on

            `source_address`''s balance. When unset, the transfer is built as a

            plain `transfer` call authorized by `source_address` itself.


            A Stellar address (example: `GAAAAAAAACGC6SEYFBKQ33QJ2FXVEP3EJ6BE2FCVW2SSP6X5TBNQYQ`).'
        sourceAddress:
          type: string
          description: 'A Stellar address (example: `GAAAAAAAACGC6SEYFBKQ33QJ2FXVEP3EJ6BE2FCVW2SSP6X5TBNQYQ`).'
        destinationAddress:
          type: string
          description: 'A Stellar address (example: `GAAAAAAAACGC6SEYFBKQ33QJ2FXVEP3EJ6BE2FCVW2SSP6X5TBNQYQ`).'
        contractAddress:
          type: string
          example: CB3WFHO46J3WGRAIARNT3XD4Z7NR5SZDNG3SVKN27GOTJAQGQFAH2KAJ
          description: 'The soroban contract address of the token to transfer.


            A contract address of a SEP41 token (example: `CB3WFHO46J3WGRAIARNT3XD4Z7NR5SZDNG3SVKN27GOTJAQGQFAH2KAJ`).'
        rawAmount:
          type: string
          description: 'Example: `10000000`.'
      required:
      - sourceAddress
      - destinationAddress
      - contractAddress
      - rawAmount
