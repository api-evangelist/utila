aid: utila
name: Utila
description: >-
  Utila is an institutional digital asset wallet and stablecoin infrastructure
  platform for fintechs and enterprises. Built on MPC (multi-party computation)
  key management, it provides secure custody with policy-driven governance,
  embedded compliance and AML screening, and a resource-oriented REST API for
  programmatically managing vaults, MPC wallets, addresses, balances, and
  transactions across many blockchains — including sponsored (gas-abstracted)
  transfers, transaction simulation, an automated Co-Signer for signing
  workflows, webhooks, and a first-party CLI.
